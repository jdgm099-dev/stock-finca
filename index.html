<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Verdulería">
<meta name="theme-color" content="#1b5e20"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" id="ati" href="icon.svg">
<title>Mi Verdulería</title>
<style>
:root{--g:#1b5e20;--g2:#2e7d32;--r:#c62828;--o:#e65100}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:20px/1.35 -apple-system,Helvetica,Arial,sans-serif;background:#f1f5ee;color:#101010;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header b{font-size:23px;flex:1}header button{background:#ffffff33;color:#fff;border:0;border-radius:12px;font-size:19px;padding:10px 12px;font-weight:700}
main{padding:14px;max-width:600px;margin:auto}
.c{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;border:2px solid #d5dccf}
.btn{display:block;width:100%;border:0;border-radius:16px;background:var(--g2);color:#fff;font-size:23px;font-weight:700;padding:18px;margin-bottom:12px;text-align:center;text-decoration:none}
.btn.r{background:var(--r)}.btn.o{background:var(--o)}.btn.w{background:#fff;color:var(--g);border:3px solid var(--g)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.grid .btn{margin:0;padding:24px 6px;font-size:22px}.grid .full{grid-column:1/-1}
label{font-weight:700;display:block}
input,select{width:100%;font-size:24px;padding:13px;border:2px solid #555;border-radius:12px;margin:6px 0 12px;background:#fff}
input[type=checkbox]{width:30px;height:30px;margin:0 10px 0 0;vertical-align:middle}
.big{font-size:40px;font-weight:800}.bad{color:var(--r);font-weight:700}.ok{color:var(--g2)}small{color:#444}h3{margin:16px 0 8px}
.qr{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.qr button{width:76px;height:60px;font-size:34px;border:0;border-radius:14px;background:var(--g2);color:#fff}.qr button:first-child{background:var(--r)}
.qr span{font-size:30px;font-weight:800;min-width:100px;text-align:center;border-bottom:3px dashed #777}
.bar{position:sticky;bottom:0;background:#fff;margin:0 -14px;padding:10px 14px 2px;border-top:3px solid var(--g);font-size:26px}
.x{background:none;border:0;font-size:22px;color:var(--r)}summary{padding:4px 0}
.pc{transition:none}.g3{grid-template-columns:repeat(3,1fr)}.g3 .btn{font-size:18px;padding:14px 4px}.fr{display:flex;gap:8px;margin-top:8px}.fr button{flex:1;height:50px;font-size:26px;border:2px solid var(--g2);background:#fff;color:var(--g);border-radius:12px}.fr button.on{background:var(--g2);color:#fff}
#ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000d;color:#fff;padding:14px 22px;border-radius:30px;font-size:21px;display:none;z-index:9}
.row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eee}.tot{font-weight:800;font-size:24px}
</style></head><body>
<header><button id="bk" onclick="back()" hidden>← Volver</button><b id="t"></b><small id="sy" style="font-size:14px"></small></header>
<main id="m"></main><div id="ts"></div>
<script>
const K='verdu1',U=['kg','unidad','cabeza','atado','mazo','docena','bolsa','caja','cajón','otro'],$=s=>document.querySelector(s);
let db=loadDB(),CT={},CB={},BG=null,CV=null,PI,TOT=null,VQ='';
function seedProducts(){return[['Tomate Santa Cruz',5000,'🍅'],['Papa',6000,'🥔'],['Cebolla',6000,'🧅'],['Zanahoria',3500,'🥕'],['Locote verde',7000,'🫑'],['Ajo',12000,'🧄'],['Queso Paraguay',35000,'🧀']].map((p,i)=>({id:'p'+i,name:p[0],unit:'kg',cost:p[1],mk:40,price:Math.round(p[1]*1.4/500)*500,min:3,e:p[2]}))}
const PL={kg:'kg',unidad:'unidades',cabeza:'cabezas',atado:'atados',mazo:'mazos',docena:'docenas',bolsa:'bolsas',caja:'cajas',cajón:'cajones',otro:'otros',combo:'combos'},FR={.25:'¼',.5:'½',.75:'¾'},
pl=(u,n)=>Math.abs(n)==1?u:(PL[u]||u),qu=(n,u)=>q(n)+' '+pl(u,n),cu=u=>(['unidad','cabeza','docena','bolsa','caja'].includes(u)?'¿Cuántas ':'¿Cuántos ')+pl(u,2),
qf=n=>{const w=Math.floor(n+1e-9),r=Math.round((n-w)*100)/100;if(r==0)return String(w);return FR[r]?(w?w+' ':'')+FR[r]:q(n)},
fracOK=k=>k[0]=='p'&&P(k.slice(2)).unit=='kg';
function recost(p){const L=db.moves.filter(m=>m.pid==p.id).sort((a,b)=>a.t-b.t);let s=0,c=null;L.forEach(m=>{if(m.k=='compra'){const s0=Math.max(s,0);c=(s0*(c??m.cost)+m.q*m.cost)/(s0+m.q)}s+=m.q});if(c!==null)p.cost=c}
function reprice(){db.products.sort(srt);db.products.forEach(p=>{p.mk=mkOf(p);p.price=rnd(p.cost*(1+p.mk/100))});db.combos.forEach(c=>{const k=ccost(c);c.mk=mkOf(c,k);c.price=rnd(k*(1+c.mk/100))})}
function loadDB(){const d={products:[],combos:[],moves:[],sales:[],exp:[],biz:{name:'Mi Verdulería',wa:'',mk:40,round:500}};
try{const o=JSON.parse(localStorage.getItem(K));if(o&&o.products){Object.assign(d,o);d.products.sort((a,b)=>a.name.localeCompare(b.name,'es'));return d}}catch(e){}
d.products=seedProducts();return d}
const srt=(a,b)=>a.name.localeCompare(b.name,'es');
function localStore(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('No hay espacio para guardar. Exportá tus datos y sacá fotos más chicas.')}}
function save(){localStore();window.cloudSave&&cloudSave()}
const id=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),P=i=>db.products.find(p=>p.id==i),C=i=>db.combos.find(c=>c.id==i);
const g=n=>(Math.round(n)<0?'-':'')+'Gs. '+String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g,'.'),q=n=>String(Math.round(n*100)/100).replace('.',',');
const num=s=>{s=String(s).trim().replace(',','.');const m=s.match(/^(?:(\d+(?:\.\d+)?)\s+)?(\d+)\s*\/\s*(\d+)$/);if(m&&+m[3])return(+(m[1]||0))+(+m[2])/(+m[3]);return parseFloat(s)||0},mon=s=>+String(s).replace(/[.\s]/g,'').replace(',','.')||0;
const day=t=>new Date(t).toLocaleDateString('en-CA'),T=()=>day(Date.now()),dmy=s=>s.split('-').reverse().join('/');
const hm=t=>new Date(t).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st=p=>db.moves.filter(m=>m.pid==p).reduce((a,m)=>a+m.q,0),low=p=>db.moves.some(m=>m.pid==p.id)&&st(p.id)<=p.min;
const ccost=c=>c.items.reduce((a,i)=>a+i.q*(P(i.pid)||{cost:0}).cost,0),pct=p=>p.cost?q((p.price-p.cost)/p.cost*100):'0',rnd=v=>{const R=db.biz.round||500,r=v<3000?Math.min(R,100):R;return v>0?Math.max(r,Math.round(v/r)*r):0},mkOf=(o,c=o.cost)=>o.mk!=null?o.mk:(c&&o.price>0?Math.round((o.price-c)/c*100):(db.biz.mk??40)),fx=(p,bu)=>bu==p.unit?1:(p.bu==bu&&p.f?p.f:(bu=='docena'&&['unidad','cabeza','atado','mazo'].includes(p.unit)?12:'')),newCost=(p,n,t)=>{const s=Math.max(st(p.id),0);return(s*p.cost+t)/(s+n)};
const ok=N=>Object.keys(N).every(i=>st(i)>=N[i])||confirm('No hay suficiente stock de algún producto. ¿Vender igual?');
function toast(s,ms){const t=$('#ts');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',ms||1600)}
function sum(per){const t=T(),m=x=>{const d=typeof x=='string'?x:day(x);return per=='hoy'?d==t:per=='sem'?d>=day(Date.now()-6*864e5)&&d<=t:d.slice(0,7)==t.slice(0,7)},S=db.sales.filter(s=>m(s.t)),
v=S.reduce((a,s)=>a+s.total,0),c=S.reduce((a,s)=>a+s.cost,0),e=db.exp.filter(x=>m(x.d)).reduce((a,x)=>a+x.a,0),
pm=db.moves.filter(x=>x.k=='perdida'&&m(x.t)),lo=pm.reduce((a,x)=>a-x.q*x.cost,0),by={};pm.forEach(x=>by[x.why]=(by[x.why]||0)-x.q*x.cost);buy=db.moves.filter(x=>x.k=='compra'&&m(x.t)).reduce((a,x)=>a+x.q*x.cost,0);return{v,c,gb:v-c,e,net:v-c-e-lo,lo,by,buy}}
function mkSale(L,ov){const sid=id(),t=Date.now();let tot=0,cost=0,items=[];
L.forEach(l=>{const[k,i]=l.key.split(':');if(k=='p'){const p=P(i);tot+=p.price*l.q;cost+=p.cost*l.q;items.push({n:p.name,q:l.q,u:p.unit,v:p.price*l.q});db.moves.push({id:id(),pid:i,q:-l.q,k:'venta',cost:p.cost,t,sid})}
else{const c=C(i);tot+=c.price*l.q;cost+=ccost(c)*l.q;items.push({n:c.name,q:l.q,u:'combo',v:c.price*l.q});c.items.forEach(x=>db.moves.push({id:id(),pid:x.pid,q:-x.q*l.q,k:'venta',cost:P(x.pid).cost,t,sid}))}});
const lista=tot;if(ov!=null&&ov>0)tot=ov;db.sales.push({id:sid,t,items,total:tot,lista,cost});save()}
const S=[{v:'home',a:{}}];
function go(v,a){VQ='';if(v=='edit')PI=undefined;S.push({v,a:a||{}});draw();scrollTo(0,0)}
function back(){if(S.length>1)S.pop();draw()}
function draw(){const s=S[S.length-1];let r;try{r=VW[s.v](s.a)}catch(e){console.error(e);if(S.length>1){S.length=1;return draw()}r=['Error','<div class=c>Hubo un problema. Cerrá y abrí la app.</div>']}$('#t').textContent=r[0];$('#m').innerHTML=r[1];$('#bk').hidden=S.length<2;if($('#gn'))upd();if(['vta','stock','prec'].includes(s.v))applyVQ()}
const VW={
home:()=>{const r=sum('hoy'),bk=backupDays(),nl=db.products.filter(low).length;return['🥬 '+db.biz.name,`<div class=c onclick="go('res')"><div>Stock bajo: <b class="${nl?'bad':''}">${nl} ${nl==1?'producto':'productos'}</b></div><div>Ventas de hoy: <b>${g(r.v)}</b></div><div>Ganancia de hoy: <b class="${r.net<0?'bad':'ok'}">${g(r.net)}</b></div><small>Tocá para ver el resumen</small></div>
${bk>=(localStorage.getItem('verdu_synced')?30:7)&&(db.sales.length||db.moves.length)?`<div class=c style="border-color:var(--o);background:#fff3e0" onclick="go('cfg')">💾 Hace ${bk} días que no hacés copia de seguridad. <b>Tocá acá.</b></div>`:''}<div class=grid><button class=btn onclick="go('stock')">📦<br>STOCK</button><button class=btn onclick="go('prec')">💰<br>PRECIOS</button><button class=btn onclick="go('vta')">🧾<br>VENTAS</button><button class=btn onclick="go('gas')">💸<br>GASTOS</button><button class="btn o full" onclick="go('pub')">📱 PUBLICAR</button></div>
<button class="btn w" style="font-size:18px;padding:12px" onclick="go('cfg')">⚙️ Mi negocio y copia de seguridad</button>`]},
stock:()=>['📦 Stock',(db.moves.length?'':'<div class=c style="border-color:var(--o);background:#fff3e0">👋 <b>Para empezar:</b> tocá un producto y anotá una <b>ENTRADA</b> con lo que ya tenés en el local.</div>')+`<input id=vq placeholder="🔍 Buscar producto" value="${esc(VQ)}" oninput="VQ=this.value;applyVQ()">`+db.products.map(p=>{const s=st(p.id);return`<div class="c pc" data-n="${esc(nq(p.name))}" onclick="go('prod',{id:'${p.id}'})" style="border-left:12px solid ${low(p)?'var(--r)':'var(--g2)'}"><b>${th(p)}${esc(p.name)}</b><br><span class=big style="font-size:30px">${qu(s,p.unit)}</span> ${low(p)?'<span class=bad>⚠️ Stock bajo</span>':''}${db.moves.some(m=>m.pid==p.id)?'':' <small>(todavía no cargaste nada)</small>'}</div>`}).join('')],
prod:a=>{const p=P(a.id),m=db.moves.filter(x=>x.pid==p.id).sort((a,b)=>b.t-a.t),G={},L=x=>x.k=='compra'?'Compra':x.k=='venta'?'Venta':x.why;
m.forEach(x=>G[L(x)]=(G[L(x)]||0)+x.q);
return[p.name,`<div class=c>Stock actual<div class=big>${qu(st(p.id),p.unit)}</div><small>Costo ${g(p.cost)} · Precio de venta ${g(p.price)} (por ${p.unit})</small></div>
<button class=btn onclick="go('mov',{id:'${p.id}',k:'compra'})">➕ ENTRADA<small style="display:block;font-weight:400;font-size:16px">Compré mercadería</small></button><button class="btn r" onclick="go('mov',{id:'${p.id}',k:'perdida'})">⚠️ PÉRDIDA<small style="display:block;font-weight:400;font-size:16px">Se echó a perder, lo consumí o lo regalé</small></button>
<div class=c><b>Resumen</b>${Object.keys(G).map(l=>`<div class=row><span>${l}</span><b>${G[l]>0?'+':''}${qu(G[l],p.unit)}</b></div>`).join('')||'<div>Sin movimientos</div>'}</div>
<div class=c><b>Movimientos</b> <small>(tocá uno para corregirlo)</small>${m.slice(0,40).map(x=>`<div class=row onclick="go('mvd',{id:'${x.id}'})"><span>${x.q>0?'+':''}${qu(x.q,p.unit)} — ${L(x)}${x.bq&&x.bu!=p.unit?' ('+qu(x.bq,x.bu)+')':''}</span><small>${dmy(day(x.t))} ›</small></div>`).join('')}</div>`]},
mov:a=>{const p=P(a.id),k=a.k,bu=p.bu||p.unit;return[{compra:'➕ Entrada',perdida:'⚠️ Pérdida'}[k]+' — '+p.name,`<div class=c>
${k=='compra'?`<label>Compré en</label><select id=bu onchange="mvu()">${[bu,...U.filter(u=>u!=bu)].map(u=>`<option ${u==bu?'selected':''}>${u}`).join('')}</select>`:''}
<label id=lq>${cu(k=='compra'?bu:p.unit)}?</label><input id=q inputmode=decimal placeholder="0" oninput="cp()">${p.unit=='kg'?'<small>Medio kilo = 0,5 · tres cuartos = 0,75 (o escribí 3/4)</small>':''}
${k=='compra'?`<div id=fr style="display:${bu==p.unit?'none':'block'}"><label id=lf>${cu(p.unit)} trae cada ${bu}?</label><input id=f inputmode=decimal value="${fx(p,bu)}" oninput="cp()"></div><label>Costo total pagado (Gs.)</label><input id=c inputmode=numeric placeholder="100000" oninput="cp()"><div id=cp class=ok style="font-weight:700"></div>`:''}
${k=='perdida'?'<label>Motivo</label><select id=w><option>Consumo familiar<option>Merma<option>Producto dañado<option>Regalo<option>Otro</select>':''}</div><button class=btn onclick="doMov('${p.id}','${k}')">GUARDAR</button>`]},
mvd:a=>{const m=db.moves.find(x=>x.id==a.id);if(!m)throw 0;const p=P(m.pid),L=m.k=='compra'?'Compra':m.k=='venta'?'Venta':m.why,
head=`<div class=c><b>${esc(p.name)}</b><br>${dmy(day(m.t))} ${hm(m.t)}<br><span class=big style="font-size:30px">${m.q>0?'+':''}${qu(m.q,p.unit)}</span> — ${L}</div>`;
if(m.k=='venta')return['Movimiento',head+`<div class=c>Este movimiento es parte de una venta. Para corregirlo, anulá la venta.</div><button class=btn onclick="go('hv')">📋 Ir a ventas anteriores</button>`];
return['Corregir movimiento',head+`<div class=c><label>Cantidad (${p.unit})</label><input id=q inputmode=decimal value="${Math.abs(m.q)}">${m.k=='compra'?`<label>Costo total pagado (Gs.)</label><input id=c inputmode=numeric value="${Math.round(m.cost*m.q)}">`:`<label>Motivo</label><select id=w>${['Consumo familiar','Merma','Producto dañado','Regalo','Otro'].map(o=>`<option ${o==m.why?'selected':''}>${o}`).join('')}</select>`}</div><button class=btn onclick="doMvEdit('${m.id}')">GUARDAR CAMBIOS</button><button class="btn r" onclick="delMove('${m.id}')">🗑️ BORRAR ESTE MOVIMIENTO</button>`]},
prec:()=>['💰 Precios',`<div class=grid><button class=btn onclick="go('edit',{id:''})">➕ Producto nuevo</button><button class="btn w" onclick="ce('')">➕ Combo nuevo</button></div><input id=vq placeholder="🔍 Buscar producto" value="${esc(VQ)}" oninput="VQ=this.value;applyVQ()">`+db.products.map(p=>`<div class="c pc" data-n="${esc(nq(p.name))}" onclick="go('edit',{id:'${p.id}'})"><b>${th(p)}${esc(p.name)}</b> <small>por ${p.unit}</small><div class=row><span>Costo</span><b>${g(p.cost)}</b></div><div class=row><span>Precio de venta</span><b>${g(p.price)}</b></div><div class=row><span>Ganancia</span><b class=ok>${g(p.price-p.cost)} (${pct(p)}%)</b></div></div>`).join('')+`<h3>🧺 Combos</h3>`+(db.combos.length?'':'<div class=c><small>Todavía no armaste combos.</small></div>')+db.combos.map(c=>`<div class=c onclick="ce('${c.id}')"><b>${th(c)}${esc(c.name)}</b><div class=row><span>Costo</span><b>${g(ccost(c))}</b></div><div class=row><span>Precio de venta</span><b>${g(c.price)}</b></div><div class=row><span>Ganancia</span><b class=ok>${g(c.price-ccost(c))}</b></div></div>`).join('')],
edit:a=>{const p=a.id?P(a.id):{name:'',unit:'kg',cost:0,price:0,min:3,img:'',mk:db.biz.mk??40};return[a.id?'Editar producto':'Producto nuevo',`<div class=c><label>Nombre</label><input id=n value="${esc(p.name)}"><label>Foto del producto</label><label class="btn w" style="font-size:18px;padding:12px;margin-bottom:8px">📷 Sacar o elegir foto<input type=file accept="image/*" hidden onchange="pickP(this)"></label><div id=pv>${p.img?`<img src="${p.img}" style="width:120px;border-radius:10px">`:''}</div><button class="btn w" style="font-size:17px;padding:10px" onclick="PI='';$('#pv').innerHTML=''">Quitar foto</button><label>Unidad principal (así se cuenta el stock)</label><select id=u onchange="ul()">${U.map(u=>`<option ${u==p.unit?'selected':''}>${u}`).join('')}</select>
<label id=lc>Costo por ${p.unit} (Gs.)</label><input id=c inputmode=numeric value="${Math.round(p.cost)||''}" oninput="upd()"><small>Se actualiza solo cuando anotás una Entrada.</small><label style="margin-top:10px">Ganancia % (sobre el costo)</label><input id=k inputmode=decimal value="${mkOf(p)}" oninput="upd()"><div class="big ok" id=gn style="font-size:26px"></div>
<label id=lm>Avisar cuando queden menos de (${p.unit})</label><input id=m inputmode=decimal value="${p.min}"></div><button class=btn onclick="doEdit('${a.id}')">GUARDAR</button>${a.id?`<button class="btn r" onclick="delP('${a.id}')">Eliminar producto</button>`:''}`]},
cedit:()=>{const c=ccost(CB),k=CB.mk??db.biz.mk??40,pr=rnd(c*(1+k/100));return[CB.id?'Combo':'Combo nuevo',`<div class=c><label>Nombre</label><input id=cn value="${esc(CB.name)}"><label>Ganancia % (sobre el costo)</label><input id=ck inputmode=decimal value="${k}" oninput="syncCB();updC()">
<label>Foto del combo</label><label class="btn w" style="font-size:18px;padding:12px;margin-bottom:8px">📷 Sacar o elegir foto<input type=file accept="image/*" hidden onchange="pickC(this)"></label>${CB.img?`<img src="${CB.img}" style="width:120px;border-radius:10px;margin:8px 0">`:''}<br><b>Contiene:</b>${CB.items.map((x,i)=>`<div class=row><span>${qu(x.q,P(x.pid).unit)} de ${esc(P(x.pid).name)}</span><button class=x onclick="syncCB();CB.items.splice(${i},1);draw()">✖</button></div>`).join('')}
